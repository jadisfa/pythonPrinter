            $('#btnPreview1').click(() => {
                //获取当前页所有的html内容
                const html = $("#content1").html();
                //获取内容的高度要求单位是mm的
                var height = $('body').height() * 0.264583 + 15;
                //打印预览
                $.ajax({
                    url: '/preview',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        contents: [encodeURIComponent(html)],
                        options: {
                            taskKey: new Date().getTime(), //可以使用业务的唯一标识，用于查询打印状态
                            printUnit: "mm",//支持单位 mm 毫米、inch 英寸、pt 颗粒、didot 印刷粒度
                            printerType: 'tag',
                            printFullPage: true,
                            zip: false,//true问开启压缩,content内容请使用gzip压缩
                            pageRect: {
                                width: 42, //纸张宽度 单位mm
                                height: 74, //纸张宽度 单位mm
                            },
                            orientation: "portrait", // 页面方向 portrait纵向 landscape横向,默认为纵向
                        }
                    }),
                    success: function (data) {
                        alert('请求成功');
                    },
                    error: function (e) {
                        alert(e.message);
                    }
                });
